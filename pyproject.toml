[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-predictor"
version = "0.1.0"
description = "Reproducible Research: House Price Prediction - R to Python Translation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Reproducible Research Team", email = "team@example.com"}
]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "sphinx>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["house_price_predictor*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
