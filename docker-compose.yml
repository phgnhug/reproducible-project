version: '3.8'

services:
  # Pull from DockerHub and generate report (for presentation)
  report:
    image: phgnhug/house-price-predictor:latest
    container_name: house-price-report
    volumes:
      - ./report:/app/report
    working_dir: /app
    command: make report

  # Build locally for development
  dev:
    build: .
    container_name: house-price-dev
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./report:/app/report
    working_dir: /app
    command: /bin/bash
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

  test:
    image: phgnhug/house-price-predictor:latest
    container_name: house-price-test
    working_dir: /app
    command: make test
